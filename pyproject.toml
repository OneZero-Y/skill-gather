[project]
name = "skill-gather"
version = "0.1.0"
description = "AI Agent Skill discovery engine and registry"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "pyyaml>=6.0.2",
    "rich>=13.9.0",
    "click>=8.1.0",
    "python-dotenv>=1.0.0",
    "mcp>=1.12.0",
]

[project.scripts]
skill-gather = "skill_gather.main:cli"
skill-gather-mcp = "skill_gather.mcp.server:main"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["skill_gather"]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.0.0",
]
