# Skill Store — Data Source Configuration
# ============================================================
# Adding a new source = append an entry here, zero code changes.
# adapter types: github_repo | github_repo_list | awesome_list | skills_sh | web_api
# ============================================================

sources:

  # ──────────────────────────────────────────────────────────
  # Tier 1: Official organisation repos (multi-skill structure)
  # skills/{name}/SKILL.md
  # ──────────────────────────────────────────────────────────

  - id: anthropics-skills
    adapter: github_repo
    repo: anthropics/skills
    branch: main
    skill_root: skills
    skill_marker: SKILL.md
    license_default: Apache-2.0

  - id: openai-skills
    adapter: github_repo
    repo: openai/skills
    branch: main
    skill_root: skills
    skill_marker: SKILL.md

  - id: vercel-agent-skills
    adapter: github_repo
    repo: vercel-labs/agent-skills
    branch: main
    skill_root: skills
    skill_marker: SKILL.md
    license_default: MIT

  - id: langchain-skills
    adapter: github_repo
    repo: langchain-ai/langchain-skills
    branch: main
    skill_root: config/skills
    skill_marker: SKILL.md
    license_default: MIT

  # AWS 官方 Agent Toolkit（aws-iam, aws-cdk, aws-auth, aws-networking 等）
  - id: aws-agent-toolkit
    adapter: github_repo
    repo: aws/agent-toolkit-for-aws
    branch: main
    skill_root: skills
    skill_marker: SKILL.md

  # GitHub 官方 Copilot skill 集合（refactor, code-review, git-flow 等）
  - id: github-awesome-copilot
    adapter: github_repo
    repo: github/awesome-copilot
    branch: main
    skill_root: skills
    skill_marker: SKILL.md

  # Microsoft VSCode 内置 skills（commit, fix-ci, code-review, merge 等）
  - id: microsoft-vscode-skills
    adapter: github_repo
    repo: microsoft/vscode
    branch: main
    skill_root: src/vs/sessions/skills
    skill_marker: SKILL.md

  # Supabase 官方内置 skills（studio-error-handling, react-hook-form, copywriting 等）
  - id: supabase-skills
    adapter: github_repo
    repo: supabase/supabase
    branch: master
    skill_root: .claude/skills
    skill_marker: SKILL.md

  # 字节跳动 DeerFlow 框架内置 skills
  - id: bytedance-deerflow
    adapter: github_repo
    repo: bytedance/deer-flow
    branch: main
    skill_root: skills/public
    skill_marker: SKILL.md

  # 158 个科学研究 skill（生物/化学/医学/药物发现）
  - id: scientific-agent-skills
    adapter: github_repo
    repo: K-Dense-AI/scientific-agent-skills
    branch: main
    skill_root: skills
    skill_marker: SKILL.md

  # AI 研究工程 skill（RAG、向量数据库等）
  - id: orchestra-ai-research-skills
    adapter: github_repo
    repo: Orchestra-Research/AI-Research-SKILLs
    branch: main
    skill_root: .
    skill_marker: SKILL.md

  # ──────────────────────────────────────────────────────────
  # Tier 2: Awesome-list (parse README for skill repo links)
  # ──────────────────────────────────────────────────────────

  - id: voltagent-awesome
    adapter: awesome_list
    repo: VoltAgent/awesome-agent-skills
    branch: main
    readme_path: README.md

  # 更大的聚合列表（1000+ skills）
  - id: voltagent-awesome-claude
    adapter: awesome_list
    repo: VoltAgent/awesome-claude-skills
    branch: main
    readme_path: README.md

  - id: heilcheng-awesome
    adapter: awesome_list
    repo: heilcheng/awesome-agent-skills
    branch: main
    readme_path: README.md

  # ──────────────────────────────────────────────────────────
  # Tier 3: Community individual-repo list
  # ──────────────────────────────────────────────────────────

  - id: community-repos
    adapter: github_repo_list
    repos:
      # DevOps / Infrastructure
      - antonbabenko/terraform-skill
      # Testing / QA
      - cypress-io/ai-toolkit
      - coderabbitai/skills
      # Security
      - snyk/agent-scan
      # Frontend / Design
      - angular/skills
      - ibelick/ui-skills
      - op7418/NanoBanana-PPT-Skills
      - bergside/awesome-design-skills      # 67 个设计 skill
      # Data / Backend
      - qdrant/skills
      # API / Cloud
      - google/skills
      - NVIDIA/skills
      - resend/resend-skills
      - veniceai/skills                     # Venice.ai API skills
      - alpacahq/alpaca-skills              # Alpaca 交易 API skills
      # Content / Writing
      - mattpocock/skills
      # Marketing
      - BrianRWagner/ai-marketing-skills
      # iOS / Apple
      - AvdLee/SwiftUI-Agent-Skill
      - rudrankriyam/app-store-connect-cli-skills
      # Misc
      - deanpeters/Product-Manager-Skills
      - LambdaTest/agent-skills
      - video-db/skills
      - TerminalSkills/skills               # 开源 skill 库
      - seb1n/awesome-ai-agent-skills       # 103 个现成 skill
      - gamedev-skills/awesome-gamedev-agent-skills  # 67 个游戏开发 skill
      - machina-sports/sports-skills        # 体育数据 + 预测市场 skill
      - arpitg1304/robotics-agent-skills    # ROS1/ROS2 机器人 skill
      - ajhcs/healthcare-agents             # 51 个医疗行政 skill

  # ──────────────────────────────────────────────────────────
  # Tier 4: skills.sh — install-count signals
  # Fetches install statistics for known repos to enrich signals layer.
  # Does NOT discover new skills — only enriches existing ones.
  # ──────────────────────────────────────────────────────────

  - id: skills-sh-signals
    adapter: skills_sh
    # List of repo slugs to fetch install counts for
    repos:
      - anthropics/skills
      - vercel-labs/agent-skills
      - langchain-ai/langchain-skills
      - openai/skills
      - aws/agent-toolkit-for-aws
      - K-Dense-AI/scientific-agent-skills

  # ──────────────────────────────────────────────────────────
  # Tier 5: Web platform adapters (pending API reverse-engineering)
  # ──────────────────────────────────────────────────────────

  - id: skillhub-cn
    adapter: web_api
    platform: skillhub
    base_url: https://api.skillhub.cn
    api_path: /api/skills
    page_size: 100
    max_pages: 20      # 最多 2000 条
    sort_by: score
    order: desc

  - id: mcpmarket-cn
    adapter: web_api
    platform: mcpmarket
    base_url: https://mcpmarket.cn
    api_path: /skills/api/list
    page_size: 100
    max_pages: 20      # 最多 2000 条
