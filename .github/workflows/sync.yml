name: Sync Registry

on:
  schedule:
    # Run daily at 04:00 UTC
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "Source ID to sync (leave empty for all)"
        required: false
        default: ""

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Run sync
        env:
          GITHUB_TOKEN: ${{ secrets.SKILL_STORE_GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.source }}" ]; then
            uv run skill-gather sync --source "${{ github.event.inputs.source }}"
          else
            uv run skill-gather sync
          fi

      - name: Print stats
        run: uv run skill-gather stats

      - name: Update README stats
        run: uv run python scripts/update_readme.py

      - name: Export web data
        run: uv run python scripts/export_web_data.py

      - name: Commit registry update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add registry/sources/ registry/meta.json registry/skills_sh_installs.json README.md web/data/skills.yml
          # Only commit if there are changes
          git diff --cached --quiet || git commit -m "chore: sync registry $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
