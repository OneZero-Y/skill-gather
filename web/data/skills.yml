    \n四种脱敏策略：\n1.（默认）哈希映射 ：`123456` → `59497` (固定映射) | 相同数值替换一致，支持映射还原，大多数场景首选\n2.占位符\
    \ ： `123456` → `[A]`, `789` → `[B]` | 发给大模型时完全隐藏数值 \n3. 模糊化:  `123456` → `125000`\
    \ | 保留数量级，数据仍有参考意义 \n4. 区间替换: 123456` → `[86419~160492]` | 只关心数量级区间，不关心具体值\n\n\
    例，\n1. 帮我将这段话脱敏：今年营收88718万元，同比增长99%，用户数达6845万，净利润251万元\n输出：今年营收74643万元，同比增长22%，用户数达8252万，净利润388万元\n\
